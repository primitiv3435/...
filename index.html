<script>

let OKS=true;

const db=mkdb((()=>{try{return localStorage}catch(e){return{getItem(){throw 0},setItem(){throw 0},removeItem(){throw 0}}}})()),sdb=mkdb((()=>{try{return sessionStorage}catch(e){return{getItem(){throw 0},setItem(){throw 0},removeItem(){throw 0}}}})());

/* ---------- AUTH ---------- */
function authView(){$('#app').innerHTML=`<div class="au"><div class="lg">N</div><h1>NEXA</h1><small>PLANEJE · CONQUISTE · EVOLUA</small>${OKS?'':'<div class="wn">⚠ Seu navegador está bloqueando o armazenamento. Sua conta só vale enquanto esta aba estiver aberta. Abra o arquivo direto no Chrome ou Safari, fora de pré-visualizações.</div>'}

${mode=='up'?`<label class="fi">${ic('note')}<input id="nm" placeholder="Seu nome"></label>`:''}

async function doAuth(){const e=$('#em').value.trim().toLowerCase(),p=$('#pw').value;if(!e||p.length<6)return toast('Informe usuário e senha (mín. 6 caracteres)');
const h=await hash(p),A=getAcc();

if(!Object.keys(A).length&&db.get(K)&&!db.get('nexa_u_'+e))db.set('nexa_u_'+e,db.get(K));
A[e]={n,h};db.set(AK,JSON.stringify(A))}else if(!A[e]||A[e].h!=h)return toast('Usuário ou senha incorretos');
($('#rm').checked?db:sdb).set(SK,e);try{navigator.storage.persist()}catch(x){}start(e);if(!OKS)setTimeout(()=>toast('⚠ Este navegador não está guardando seus dados. Abra o arquivo direto no Chrome ou Safari.'),400)}
function start(e){const A=getAcc();if(!A[e]){if(e){db.del(SK);sdb.del(SK);authView();toast('Conta não encontrada neste aparelho. Restaure um backup ou crie a conta de novo.')}else authView();return}U={email:e,name:A[e].n};

const NC=['#2a3530','#b4f24a','#4c8dff','#ff5d73','#ffb84d','#b78cff'],wc=b=>(b.trim().match(/\S+/g)||[]).length;let NQ='',NF='all',NCo=0,NPn=false;
const nFil=()=>{const q=NQ.toLowerCase();return S.notes.filter(n=>(NF=='all'||(NF=='pin'?n.pin:/(^|\n)\[( |x)\] /i.test(n.body)))&&(!q||(n.title+' '+n.body).toLowerCase().includes(q))).sort((a,b)=>(b.pin?1:0)-(a.pin?1:0)||(b.updated||0)-(a.updated||0))};
const nList=()=>{const l=nFil();return l.length?l.map(n=>{const ls=n.body.split('\n'),ck=ls.filter(x=>/^\[( |x)\] /i.test(x)),dn=ck.filter(x=>/^\[x\]/i.test(x)).length;
return`<div class="card nc" style="--c:${n.color||NC[0]}"><div class="row" style="align-items:flex-start"><b style="flex:1;min-width:0;cursor:pointer" onclick="nF(${n.id})">${n.pin?'📌 ':''}${esc(n.title)}</b><button class="dots" onclick="nM(${n.id})">${ic('dots',18)}</button></div><div style="margin:6px 0">${ls.map((x,i)=>[x,i]).filter(a=>a[0].trim()).slice(0,6).map(([x,i])=>/^\[( |x)\] /i.test(x)?`<div class="ci" onclick="nT(${n.id},${i})"><span class="ck sm ${/^\[x\]/i.test(x)?'on':''}">${/^\[x\]/i.test(x)?ic('check',12):''}</span><span class="${/^\[x\]/i.test(x)?'dn':''}">${esc(x.slice(4))}</span></div>`:`<div class="mu" style="font-size:13.5px;cursor:pointer" onclick="nF(${n.id})">${esc(x)}</div>`).join('')}</div><div class="mu row"><span>${ck.length?dn+'/'+ck.length+' feitos':wc(n.body)+' palavras'}</span><span>${new Date(n.updated||Date.now()).toLocaleDateString('pt-BR')}</span></div></div>`}).join(''):'<div class="empty">Nenhuma nota encontrada.<br>Toque no + para escrever.</div>'};
const nR=()=>$('#nl').innerHTML=nList();
function notes(){const ch=(k,t)=>`<button class="chip ${NF==k?'on':''}" onclick="NF='${k}';render()">${t}</button>`;
return head('Notas','Ideias, listas e lembretes.',plus('nF()'))+`<input class="in" style="margin-bottom:12px" placeholder="Buscar nas notas" value="${esc(NQ)}" oninput="NQ=this.value;nR()"><div class="chips">${ch('all','Todas')}${ch('pin','Fixadas')}${ch('list','Listas')}</div><div id="nl">${nList()}</div>`}
function nW(){const b=$('#nb').value;$('#nw').textContent=wc(b)+' palavras · '+b.length+' caracteres'}
function nAdd(){const t=$('#nb');t.value+=(t.value&&!t.value.endsWith('\n')?'\n':'')+'[ ] ';t.focus();nW()}
function nCo(i,el){NCo=i;document.querySelectorAll('.cd').forEach(b=>b.classList.remove('on'));el.classList.add('on')}
function nF(id){const n=S.notes.find(x=>x.id==id)||{};NCo=Math.max(0,NC.indexOf(n.color||NC[0]));NPn=!!n.pin;
sheet(id?'Editar nota':'Nova nota',`<label class="lb">Título</label><input id="nt" class="in" placeholder="Ex: Ideias" value="${esc(n.title||'')}"><label class="lb">Texto</label><textarea id="nb" rows="9" class="in" placeholder="Escreva aqui..." oninput="nW()">${esc(n.body||'')}</textarea><div class="row" style="margin-top:8px"><button class="chip" style="flex:none;padding:8px 14px" onclick="nAdd()">+ Item de checklist</button><span id="nw" class="mu"></span></div><label class="lb">Cor</label><div>${NC.map((c,i)=>`<button class="cd ${i==NCo?'on':''}" style="--c:${c}" onclick="nCo(${i},this)"></button>`).join('')}</div><div class="row" style="margin-top:18px"><span>Fixar no topo</span><button class="sw ${NPn?'on':''}" onclick="NPn=!NPn;this.classList.toggle('on')"></button></div><button class="btn" onclick="nS(${id||0})">Salvar</button>${id?`<button class="btn d" onclick="nX(${id})">Excluir</button>`:''}`);nW()}
function nS(id){const title=$('#nt').value.trim()||'Sem título',body=$('#nb').value.trim();if(!body)return toast('Escreva algo na nota');const o={title,body,color:NC[NCo],pin:NPn,updated:Date.now()};if(id)Object.assign(S.notes.find(x=>x.id==id),o);else S.notes.unshift({id:Date.now(),...o});cl();save();toast('Nota salva ✓')}
function nT(id,i){const n=S.notes.find(x=>x.id==id),ls=n.body.split('\n');ls[i]=(/^\[x\]/i.test(ls[i])?'[ ] ':'[x] ')+ls[i].slice(4);n.body=ls.join('\n');save()}
function nM(id){const n=S.notes.find(x=>x.id==id);sheet('Nota',`<button class="btn o" onclick="nP(${id})">${n.pin?'Desafixar':'Fixar no topo'}</button><button class="btn o" onclick="nDu(${id})">Duplicar</button><button class="btn o" onclick="nCp(${id})">Copiar texto</button><button class="btn d" onclick="nX(${id})">Excluir</button>`)}
function nP(id){const n=S.notes.find(x=>x.id==id);n.pin=!n.pin;cl();save()}
function nDu(id){const n=S.notes.find(x=>x.id==id);S.notes.unshift({...n,id:Date.now(),title:n.title+' (cópia)',pin:false,updated:Date.now()});cl();save();toast('Nota duplicada ✓')}
function nCp(id){const n=S.notes.find(x=>x.id==id);cl();(navigator.clipboard?navigator.clipboard.writeText(n.title+'\n\n'+n.body):Promise.reject()).then(()=>toast('Copiado ✓'),()=>toast('Não foi possível copiar'))}
function nX(id){if(!confirm('Apagar esta nota?'))return;S.notes=S.notes.filter(x=>x.id!=id);cl();save()}

/* ---------- NEXA AI (via Netlify Function, chave protegida no servidor) ---------- */
const FR=['Todos os dias','Segunda a sexta','3x por semana','2x por semana','1x por semana'];let AIB=false;
const AILIM=8,AILK='nexa_ai_daily';
function aiUsage(){const d=new Date().toISOString().slice(0,10);let u;try{u=JSON.parse(localStorage.getItem(AILK)||'{}')}catch(e){u={}}if(u.date!==d)u={date:d,count:0};return u}
function aiUsageLeft(){return Math.max(0,AILIM-aiUsage().count)}
function aiUsageBump(){const u=aiUsage();u.count++;try{localStorage.setItem(AILK,JSON.stringify(u))}catch(e){}}
const AIS=['Quero criar o hábito de estudar 30 minutos por dia, 3 vezes na semana','Monte uma rotina de manhã para eu ser mais produtivo','Como eu uso as Finanças e as assinaturas no app?','Estou procrastinando muito. Me ajuda?'];
const aiFmt=t=>esc(t).replace(/^#{1,4} (.+)$/gm,'<b>$1</b>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^[-*•] (.+)$/gm,'<span class="li">• $1</span>').replace(/<\/span>\n/g,'</span>').replace(/\n/g,'<br>');
function aiParse(raw){const re=/\[\[\s*HABITO\s*\|([^\]]*)\]\]/i,m=raw.match(re),t=raw.replace(new RegExp(re.source,'gi'),'').trim();if(!m)return{t};
const [ti,am,u0,fr,ct]=m[1].split('|').map(x=>x.trim());if(!ti)return{t};let u=(u0||'vezes').toLowerCase();
u=/^min/.test(u)?'min':/^hora/.test(u)?'horas':/^p[áa]g/.test(u)?'páginas':/^copo/.test(u)?'copos':/^vez/.test(u)?'vezes':u.slice(0,14);
const n=(fr||'').match(/(\d)\s*x/i),f=FR.find(x=>x.toLowerCase()==(fr||'').toLowerCase())||(n?({1:FR[4],2:FR[3],3:FR[2],4:FR[1],5:FR[1],6:FR[0],7:FR[0]})[n[1]]:null)||FR[0];
return{t,h:{title:ti.slice(0,40),amount:+(am||'').replace(',','.')||1,unit:u,freq:f,cat:['Saúde','Estudo','Lazer','Outros'].find(c=>c.toLowerCase()==(ct||'').toLowerCase())||'Outros'}}}
const aiHC=(m,i)=>`<div class="hc2"><div class="mu" style="font-size:11px;letter-spacing:.8px">HÁBITO NEXA</div><b>${esc(m.h.title)}</b><div class="mu">${nn(m.h.amount)} ${esc(m.h.unit)} · ${esc(m.h.freq)} · ${esc(m.h.cat)}</div>${m.h.added?'<div class="pos" style="margin-top:8px">✓ Adicionado aos seus hábitos</div>':`<button class="btn" style="margin:10px 0 0;padding:11px" onclick="aiAdd(${i})">Adicionar aos meus hábitos</button>`}</div>`;
const aiMsg=(m,i)=>m.r=='user'?`<div class="mg u">${esc(m.t)}</div>`:`<div class="mg a">${aiFmt(m.t)}${m.h?aiHC(m,i):''}</div>`;
const aiBody=()=>{const c=S.chat||[];return(c.length?c.map(aiMsg).join(''):`<div class="mg a">Oi, ${esc(U.name)}! Eu sou a Nexa AI 💚 Posso montar planos de hábitos, organizar sua rotina, dar dicas de produtividade e te ajudar a usar o app. Por onde começamos?</div><div class="qs">${AIS.map((q,i)=>`<button class="chip" style="flex:none;text-align:left;padding:9px 14px" onclick="aiQ(${i})">${q}</button>`).join('')}</div>`)+(AIB?'<div class="mg a"><span class="tp"><i></i><i></i><i></i></span></div>':'')};
const aiScroll=()=>scrollTo({top:document.body.scrollHeight,behavior:'smooth'}),aiDraw=()=>{const el=$('#cm');if(el){el.innerHTML=aiBody();aiScroll()}};
function nai(){const top=head('Nexa AI','Sua mentora de hábitos e produtividade.',`<button class="av" onclick="aiMenu()">${ic('dots',18)}</button>`),left=aiUsageLeft();
setTimeout(aiScroll,0);
return top+`<div id="cm">${aiBody()}</div>`+(left<=0?`<div class="card" style="margin:0 0 12px"><b>Limite diário atingido</b><div class="mu" style="font-size:13px;margin-top:4px">Você usou suas ${AILIM} mensagens grátis de hoje. Volte amanhã para continuar conversando com a Nexa AI 💚</div></div>`:`<div class="cb2"><input id="aiq" class="in" placeholder="Fale com a Nexa AI..." enterkeyhint="send" onkeydown="event.key=='Enter'&&aiSend()"><button onclick="aiSend()" aria-label="Enviar">↑</button></div><div class="mu" style="text-align:center;font-size:11px;margin-top:6px">${left} mensagem${left==1?'':'s'} grátis restante${left==1?'':'s'} hoje</div>`)+`<div style="height:72px"></div>`}
function aiMenu(){sheet('Nexa AI',`<button class="btn o" onclick="aiClear()">Limpar conversa</button>`)}
function aiClear(){if(!confirm('Apagar toda a conversa com a Nexa AI?'))return;S.chat=[];cl();save()}
function aiQ(i){$('#aiq').value=AIS[i];aiSend()}
function aiAdd(i){const m=(S.chat||[])[i];if(!m||!m.h||m.h.added)return;if(S.habits.some(x=>String(x.title).toLowerCase()==m.h.title.toLowerCase()))return toast('Você já tem um hábito com esse nome');
S.habits.push({id:Date.now(),title:m.h.title,amount:m.h.amount,unit:m.h.unit,freq:m.h.freq,cat:m.h.cat,progress:0,pd:''});m.h.added=true;save();toast('Hábito criado ✓ Veja em Hábitos')}
async function aiSend(){const inp=$('#aiq');if(!inp)return;const t=inp.value.trim();if(!t||AIB)return;
if(aiUsageLeft()<=0){toast('Limite diário de mensagens atingido. Volte amanhã 💚');return}
S.chat=S.chat||[];S.chat.push({r:'user',t});inp.value='';AIB=true;aiDraw();
try{const hist=S.chat.filter(m=>!m.err).slice(-14).map(m=>({role:m.r,content:m.t})),
r=await fetch('/.netlify/functions/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:hist,userName:U.name,habits:S.habits.map(h=>`${h.title} (${nn(h.amount)} ${un(h)}, ${h.freq||'Todos os dias'})`),goals:S.goals.map(g=>g.title||g.name).filter(Boolean)})}),j=await r.json().catch(()=>({}));
if(!r.ok)throw new Error(r.status==429?'Muitas mensagens em pouco tempo. Aguarde alguns segundos e tente de novo.':(j&&j.error)||'Erro '+r.status);
aiUsageBump();const a=aiParse(j.content||'');S.chat.push({r:'assistant',t:a.t||'Não consegui responder agora. Tente de novo.',h:a.h})}
catch(e){S.chat.push({r:'assistant',err:1,t:'⚠ '+(e instanceof TypeError?'Sem conexão com a Nexa AI. Verifique a internet e tente de novo.':e.message)})}
AIB=false;S.chat=S.chat.slice(-40);if(U)db.set(sk(),JSON.stringify(S));render()}

start(db.get(SK)||sdb.get(SK)||'');
</script></body></html>
