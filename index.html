function syncSubs(){let c=0;const n=new Date(),p2=v=>String(v).padStart(2,'0');

while(y<n.getFullYear()||(y==n.getFullYear()&&m<=n.getMonth())){const k=y+'-'+p2(m+1),dd=Math.min(x.day||st.getDate(),new Date(y,m+1,0).getDate()),dt=k+'-'+p2(dd);
if(dt<=td()&&!x.gen.includes(k)){S.transactions.push({id:Date.now()+c,desc:x.name,value:x.value,type:'expense',cat:'Assinaturas',date:dt,account:acc(x),sub:x.id});x.gen.push(k);c++}
if(++m>11){m=0;y++}}});return c}

const WK_T=['Academia','Caminhada','Corrida','Ciclismo','Exercício em casa','Personalizado'];
function workouts(){const l=(S.workouts||[]).slice().sort((a,b)=>b.id-a.id);
return headB('health','Exercícios','Registre seus treinos.',plus('wkF()'))+
(l.length?l.map(w=>`<div class="card row"><div><b>${esc(w.type)}</b><div class="mu">${fd(w.date)}${w.duration?' · '+w.duration+' min':''}</div></div><button class="dots" onclick="wkX(${w.id})">${ic('x',16)}</button></div>`).join(''):'<div class="empty">Nenhum treino ainda.<br>Toque no + para registrar.</div>')}
function wkF(){sheet('Novo treino',`<label class="lb">Tipo</label><select id="wkt" class="in">${WK_T.map(t=>`<option>${t}</option>`).join('')}</select><label class="lb">Duração (min)</label><input id="wkd" type="number" class="in" placeholder="Ex: 40"><label class="lb">Data</label><input id="wkdt" type="date" class="in" value="${td()}"><button class="btn" onclick="wkS()">Salvar</button>`)}
function wkS(){S.workouts=S.workouts||[];S.workouts.push({id:Date.now(),type:$('#wkt').value,duration:+$('#wkd').value||0,date:$('#wkdt').value||td()});cl();addXP('workout');save();toast('Treino registrado ✓')}
function wkX(id){S.workouts=S.workouts.filter(x=>x.id!=id);save()}

/* SAÚDE: CORPO */
function body(){const l=(S.body||[]).slice().sort((a,b)=>a.date<b.date?-1:1),last=l[l.length-1];
return headB('health','Corpo','Acompanhe sua evolução.',plus('bF()'))+
(last?`<div class="card hero"><div class="mu">Peso atual</div><div class="big pos">${nn(last.weight)} kg</div>${S.profile&&S.profile.weightGoal?`<div class="mu" style="margin-top:4px">Meta: ${nn(S.profile.weightGoal)} kg</div>`:''}</div>`:'')+
(l.length?`<div class="card"><b>Histórico</b>${l.slice().reverse().slice(0,10).map(b=>`<div class="tr"><div style="flex:1">${fd(b.date)}${b.measures?' · '+esc(b.measures):''}</div><b>${nn(b.weight)} kg</b><button class="dots" onclick="bX(${b.id})">${ic('x',14)}</button></div>`).join('')}</div>`:'<div class="empty">Nenhum registro ainda.<br>Toque no + para adicionar.</div>')}
function bF(){sheet('Registrar peso',`<label class="lb">Peso atual (kg)</label><input id="bw" type="number" step="0.1" class="in" placeholder="Ex: 78.5"><label class="lb">Peso desejado (opcional)</label><input id="bwg" type="number" step="0.1" class="in" value="${(S.profile&&S.profile.weightGoal)||''}"><label class="lb">Medidas corporais (opcional)</label><input id="bms" class="in" placeholder="Ex: Cintura 80cm, Peito 95cm"><label class="lb">Data</label><input id="bd" type="date" class="in" value="${td()}"><button class="btn" onclick="bS()">Salvar</button>`)}
function bS(){const w=+$('#bw').value;if(!w||w<=0)return toast('Informe o peso');S.body=S.body||[];S.body.push({id:Date.now(),weight:w,date:$('#bd').value||td(),measures:$('#bms').value.trim()});if($('#bwg').value){S.profile=S.profile||{};S.profile.weightGoal=+$('#bwg').value}cl();addXP('workout');save();toast('Registrado ✓')}
function bX(id){S.body=S.body.filter(x=>x.id!=id);save()}

/* ---------- NEXA AI (via Netlify Function, chave protegida no servidor) ---------- */
const FR=['Todos os dias','Segunda a sexta','3x por semana','2x por semana','1x por semana'];let AIB=false;
const AILIM=8,AILK='nexa_ai_daily';
function aiUsage(){const d=new Date().toISOString().slice(0,10);let u;try{u=JSON.parse(localStorage.getItem(AILK)||'{}')}catch(e){u={}}if(u.date!==d)u={date:d,count:0};return u}
function aiUsageLeft(){return Math.max(0,AILIM-aiUsage().count)}
function aiUsageBump(){const u=aiUsage();u.count++;try{localStorage.setItem(AILK,JSON.stringify(u))}catch(e){}}
const AIS=['Quero criar o hábito de estudar 30 minutos por dia, 3 vezes na semana','Monte uma rotina de manhã para eu ser mais produtivo','Como eu uso as Finanças e as assinaturas no app?','Estou procrastinando muito. Me ajuda?'];
const aiInline=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g,'$1<i>$2</i>');
function aiFmt(raw){const lines=(raw||'').replace(/\r\n/g,'\n').split('\n');
const isRow=l=>/^\s*\|.*\|\s*$/.test(l),isSep=l=>/^[\s|:-]+$/.test(l)&&l.includes('-')&&l.includes('|'),
cells=l=>l.split('|').map(c=>c.trim()).filter((c,idx,a)=>!((idx==0||idx==a.length-1)&&c==''));
let out='',i=0;
while(i<lines.length){const line=lines[i];
if(!line.trim()){i++;continue}
if(isRow(line)&&isSep(lines[i+1]||'')){const head=cells(line);i+=2;const rows=[];while(i<lines.length&&isRow(lines[i])){rows.push(cells(lines[i]));i++}
out+=`<div class="tbl"><table><thead><tr>${head.map(h=>`<th>${aiInline(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${aiInline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;continue}
let m;
if(m=line.match(/^#{1,4}\s+(.+)$/)){out+=`<div class="mh">${aiInline(m[1])}</div>`;i++;continue}
if(m=line.match(/^(\d+)[.)]\s+(.+)$/)){out+=`<div class="nli"><span class="nn">${m[1]}</span><span>${aiInline(m[2])}</span></div>`;i++;continue}
if(m=line.match(/^[-*•]\s+(.+)$/)){out+=`<span class="li">• ${aiInline(m[1])}</span>`;i++;continue}
out+=`<div class="pl">${aiInline(line)}</div>`;i++}
return out}
function aiParse(raw){const re=/\[\[\s*HABITO\s*\|([^\]]*)\]\]/i,m=raw.match(re),t=raw.replace(new RegExp(re.source,'gi'),'').trim();if(!m)return{t};
const [ti,am,u0,fr,ct]=m[1].split('|').map(x=>x.trim());if(!ti)return{t};let u=(u0||'vezes').toLowerCase();
u=/^min/.test(u)?'min':/^hora/.test(u)?'horas':/^p[áa]g/.test(u)?'páginas':/^copo/.test(u)?'copos':/^vez/.test(u)?'vezes':u.slice(0,14);
const n=(fr||'').match(/(\d)\s*x/i),f=FR.find(x=>x.toLowerCase()==(fr||'').toLowerCase())||(n?({1:FR[4],2:FR[3],3:FR[2],4:FR[1],5:FR[1],6:FR[0],7:FR[0]})[n[1]]:null)||FR[0];
return{t,h:{title:ti.slice(0,40),amount:+(am||'').replace(',','.')||1,unit:u,freq:f,cat:['Saúde','Estudo','Lazer','Outros'].find(c=>c.toLowerCase()==(ct||'').toLowerCase())||'Outros'}}}
const aiHC=(m,i)=>`<div class="hc2"><div class="mu" style="font-size:11px;letter-spacing:.8px">HÁBITO NEXA</div><b>${esc(m.h.title)}</b><div class="mu">${nn(m.h.amount)} ${esc(m.h.unit)} · ${esc(m.h.freq)} · ${esc(m.h.cat)}</div>${m.h.added?'<div class="pos" style="margin-top:8px">✓ Adicionado aos seus hábitos</div>':`<button class="btn" style="margin:10px 0 0;padding:11px" onclick="aiAdd(${i})">Adicionar aos meus hábitos</button>`}</div>`;
const aiMsg=(m,i)=>m.r=='user'?`<div class="mrow u"><div class="mg u">${esc(m.t)}</div></div>`:`<div class="mrow a"><div class="nxav">${ic('spark',14)}</div><div class="mg a">${aiFmt(m.t)}${m.h?aiHC(m,i):''}</div></div>`;
const aiBody=()=>{const c=S.chat||[];return(c.length?c.map(aiMsg).join(''):`<div class="mrow a"><div class="nxav">${ic('spark',14)}</div><div class="mg a">Oi, ${esc(U.name)}! Eu sou a Nexa AI 💚 Posso montar planos de hábitos, organizar sua rotina, dar dicas de produtividade e te ajudar a usar o app. Por onde começamos?</div></div><div class="qs">${AIS.map((q,i)=>`<button class="chip" style="flex:none;text-align:left;padding:9px 14px" onclick="aiQ(${i})">${q}</button>`).join('')}</div>`)+(AIB?`<div class="mrow a"><div class="nxav">${ic('spark',14)}</div><div class="mg a"><span class="tp"><i></i><i></i><i></i></span></div></div>`:'')};
const aiScroll=()=>scrollTo({top:document.body.scrollHeight,behavior:'smooth'}),aiDraw=()=>{const el=$('#cm');if(el){el.innerHTML=aiBody();aiScroll()}};
function nai(){const top=head('Nexa AI','Sua mentora de hábitos e produtividade.',`<button class="av" onclick="aiMenu()">${ic('dots',18)}</button>`),left=aiUsageLeft();
setTimeout(aiScroll,0);
return top+`<div id="cm">${aiBody()}</div>`+(left<=0?`<div class="card" style="margin:0 0 12px"><b>Limite diário atingido</b><div class="mu" style="font-size:13px;margin-top:4px">Você usou suas ${AILIM} mensagens grátis de hoje. Volte amanhã para continuar conversando com a Nexa AI 💚</div></div>`:`<div class="cb2"><input id="aiq" class="in" placeholder="Fale com a Nexa AI..." enterkeyhint="send" onkeydown="event.key=='Enter'&&aiSend()"><button onclick="aiSend()" aria-label="Enviar">↑</button></div><div class="mu" style="text-align:center;font-size:11px;margin-top:6px">${left} mensagem${left==1?'':'s'} grátis restante${left==1?'':'s'} hoje</div>`)+`<div style="height:72px"></div>`}
function aiMenu(){sheet('Nexa AI',`<button class="btn o" onclick="aiClear()">Limpar conversa</button>`)}
function aiClear(){if(!confirm('Apagar toda a conversa com a Nexa AI?'))return;S.chat=[];cl();save()}
function aiQ(i){$('#aiq').value=AIS[i];aiSend()}
function aiAdd(i){const m=(S.chat||[])[i];if(!m||!m.h||m.h.added)return;if(S.habits.some(x=>String(x.title).toLowerCase()==m.h.title.toLowerCase()))return toast('Você já tem um hábito com esse nome');
S.habits.push({id:Date.now(),title:m.h.title,amount:m.h.amount,unit:m.h.unit,freq:m.h.freq,cat:m.h.cat,progress:0,pd:''});m.h.added=true;save();toast('Hábito criado ✓ Veja em Hábitos')}
async function aiSend(){const inp=$('#aiq');if(!inp)return;const t=inp.value.trim();if(!t||AIB)return;
if(aiUsageLeft()<=0){toast('Limite diário de mensagens atingido. Volte amanhã 💚');return}
S.chat=S.chat||[];S.chat.push({r:'user',t});inp.value='';AIB=true;aiDraw();
try{const hist=S.chat.filter(m=>!m.err).slice(-14).map(m=>({role:m.r,content:m.t})),
r=await fetch('/.netlify/functions/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:hist,userName:U.name,habits:S.habits.map(h=>`${h.title} (${nn(h.amount)} ${un(h)}, ${h.freq||'Todos os dias'})`),goals:S.goals.map(g=>g.title||g.name).filter(Boolean)})}),j=await r.json().catch(()=>({}));
if(!r.ok)throw new Error(r.status==429?'Muitas mensagens em pouco tempo. Aguarde alguns segundos e tente de novo.':(j&&j.error)||'Erro '+r.status);
aiUsageBump();const a=aiParse(j.content||'');S.chat.push({r:'assistant',t:a.t||'Não consegui responder agora. Tente de novo.',h:a.h})}
catch(e){S.chat.push({r:'assistant',err:1,t:'⚠ '+(e instanceof TypeError?'Sem conexão com a Nexa AI. Verifique a internet e tente de novo.':e.message)})}
AIB=false;S.chat=S.chat.slice(-40);if(U)db.set(sk(),JSON.stringify(S));render()}

start(db.get(SK)||sdb.get(SK)||'');
</script></body></html>
